plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sekai.sekaipod.legacy'
    compileSdk 36

    defaultConfig {
        applicationId 'com.sekai.sekaipod.legacy'
        minSdk 16
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            // Sign the legacy release with the standard debug key so the APK is
            // directly installable from GitHub Actions.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}
