name: Build SekaiPod Android APKs

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  modern:
    name: Modern APK (Android 7.0 / API 24 → Android 16 / API 36)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - name: Verify localization files
        run: |
          test -f pubspec.yaml
          test -f l10n.yaml
          test -d lib/l10n
          test -f lib/l10n/app_en.arb
      - name: Android SDK / NDK
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358"
      - name: Dependencies
        run: flutter pub get
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build modern APK
        run: flutter build apk --release --flavor production
      - name: Locate and rename modern APK
        run: |
          APK_PATH="$(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" SekaiPod-Android7-16.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SekaiPod-Android7-to-16
          path: SekaiPod-Android7-16.apk

  legacy:
    name: Legacy APK (Android 4.1 / API 16 → Android 6 / API 23)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build legacy APK
        working-directory: legacy
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Locate and rename legacy APK
        run: |
          APK_PATH="$(find legacy/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" SekaiPod-Legacy-Android4.1-6.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SekaiPod-Android4.1-to-6
          path: SekaiPod-Legacy-Android4.1-6.apk
